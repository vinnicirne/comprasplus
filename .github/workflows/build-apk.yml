name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências Node
        run: npm install

      - name: Preparar Assets Web (www)
        run: |
          node scripts/generate-env.js
          node scripts/prepare-www.js

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Configurar Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Instalar e Sincronizar Capacitor Android
        run: |
          npx cap add android || true
          node scripts/apply-android-assets.js
          npx cap sync android

      - name: Dar permissão de execução ao Gradle Wrapper
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace || { echo "=== GRADLE BUILD FAILED ==="; ./gradlew assembleDebug --no-daemon --info; exit 1; }

      - name: Organizar Arquivo APK Final
        run: |
          mkdir -p output-apk
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erro: APK não encontrado!"
            exit 1
          fi
          echo "APK encontrado em: $APK_PATH"
          cp "$APK_PATH" output-apk/ListaDeComprasPlus.apk

      - name: Publicar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: ListaDeComprasPlus-APK
          path: output-apk/ListaDeComprasPlus.apk
          retention-days: 30

      - name: Criar Release no GitHub com Download Direto
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Lista de Compras Plus v1.0.${{ github.run_number }} (APK)"
          body: |
            🎉 **APK Android Gerado com Sucesso!**
            
            📱 Baixe o arquivo `ListaDeComprasPlus.apk` anexo abaixo para instalar diretamente no seu celular Android.
          files: output-apk/ListaDeComprasPlus.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
