<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    @layer base {
      html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "inverse-primary": "#68dba9",
            "primary-container": "#00855d",
            "inverse-surface": "#283044",
            "surface-container-low": "#f2f3ff",
            "primary-fixed-dim": "#68dba9",
            "surface-container-high": "#e2e7ff",
            "outline": "#6d7a72",
            "tertiary-fixed": "#cce5ff",
            "on-secondary-container": "#457000",
            "on-primary": "#ffffff",
            "surface-container-lowest": "#ffffff",
            "error": "#ba1a1a",
            "on-primary-container": "#f5fff7",
            "outline-variant": "#bccac0",
            "on-tertiary": "#ffffff",
            "surface-dim": "#d2d9f4",
            "on-background": "#131b2e",
            "surface-bright": "#faf8ff",
            "secondary-container": "#acf847",
            "tertiary-fixed-dim": "#93ccff",
            "on-tertiary-container": "#fdfcff",
            "surface": "#faf8ff",
            "on-secondary-fixed": "#102000",
            "surface-container-highest": "#dae2fd",
            "on-tertiary-fixed": "#001d31",
            "tertiary-container": "#007bb9",
            "on-error": "#ffffff",
            "on-secondary": "#ffffff",
            "secondary-fixed": "#acf847",
            "secondary": "#416900",
            "error-container": "#ffdad6",
            "inverse-on-surface": "#eef0ff",
            "on-secondary-fixed-variant": "#304f00",
            "on-primary-fixed-variant": "#005137",
            "on-tertiary-fixed-variant": "#004b73",
            "surface-container": "#eaedff",
            "on-error-container": "#93000a",
            "primary": "#006948",
            "surface-tint": "#006c4a",
            "tertiary": "#006194",
            "primary-fixed": "#85f8c4",
            "on-primary-fixed": "#002114",
            "background": "#faf8ff",
            "on-surface": "#131b2e",
            "secondary-fixed-dim": "#91db2a",
            "surface-variant": "#dae2fd",
            "on-surface-variant": "#3d4a42"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "margin": "1.25rem",
            "space-lg": "1.5rem",
            "gutter-sm": "0.75rem",
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "margin-sm": "1rem",
            "gutter": "1rem",
            "margin-lg": "2rem",
            "space-xl": "2rem",
            "space-md": "1rem"
          },
          "fontFamily": {
            "numeric-hero-mobile": ["Plus Jakarta Sans"],
            "body-lg": ["Plus Jakarta Sans"],
            "body-sm": ["Plus Jakarta Sans"],
            "headline-lg-mobile": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "label-lg": ["Plus Jakarta Sans"],
            "headline-sm": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "headline-xl-mobile": ["Plus Jakarta Sans"],
            "numeric-hero": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"],
            "headline-xl": ["Plus Jakarta Sans"],
            "label-md": ["Plus Jakarta Sans"],
            "label-sm": ["Plus Jakarta Sans"]
          },
          "fontSize": {
            "numeric-hero-mobile": ["28px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "400" }],
            "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }],
            "headline-lg-mobile": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
            "headline-md": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
            "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "600" }],
            "headline-sm": ["17px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "600" }],
            "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "700" }],
            "headline-xl-mobile": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "numeric-hero": ["36px", { "lineHeight": "40px", "letterSpacing": "-0.03em", "fontWeight": "800" }],
            "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }],
            "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "700" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe">
  <main class="flex-1 flex flex-col w-full bg-surface">
    <div class="flex flex-col w-full min-h-[92vh] justify-between items-center px-margin py-space-xl relative overflow-hidden">
      <div class="absolute -top-24 -left-24 w-80 h-80 bg-primary-fixed/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute top-1/2 -right-28 w-72 h-72 bg-secondary-container/15 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-20 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary-fixed-dim/15 rounded-full blur-3xl pointer-events-none"></div>
      
      <header class="w-full flex justify-between items-center z-10 pt-space-sm">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low text-on-surface-variant shadow-sm">
          <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
          <span class="font-label-sm text-label-sm uppercase tracking-wider text-primary">Controle Inteligente</span>
        </div>
        <div class="px-2.5 py-1 rounded-full bg-surface-container text-on-surface-variant font-label-sm text-label-sm">
          v2.4.0
        </div>
      </header>

      <main class="w-full flex flex-col items-center text-center z-10 my-auto py-space-md max-w-xs">
        <div class="relative group mb-space-lg">
          <div class="absolute inset-0 bg-primary/25 rounded-3xl blur-xl transform scale-110 group-hover:scale-125 transition-transform duration-700"></div>
          <div class="relative w-28 h-28 rounded-3xl bg-surface-container-lowest p-2 shadow-xl flex items-center justify-center overflow-hidden">
            <img alt="Compras Plus Icon" class="w-full h-full object-cover rounded-2xl drop-shadow-sm transform hover:scale-105 transition-transform duration-300" src="https://lh3.googleusercontent.com/aida/AEtjO1XyQ9pwepQK2IMKiocqLfUKkvbrjUs-kOArYzNxobd08c27yo257xXiU_3v27dEzw7Gt5vzXkKcaxD4CJiZUB2EuhLB87p8Qp1noL-HGihOnL4MPozXcUYgZWsfxK9cv-xwIgZt60HVAGgDNIU0pSw9dcdm8o8SbO3Omwh8vNRm-wzlJv6ZNyuAYli8YP8IGXOkdR6oLOx1ivk5jAfipTOsMhDzTv6mBfRRpstbM5eIu-EMCjR4ll8O7TE"/>
          </div>
          <div class="absolute -bottom-2 -right-2 w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center shadow-md">
            <span class="material-symbols-outlined text-[18px]">trending_up</span>
          </div>
        </div>

        <div class="space-y-space-xs">
          <h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">
            Compras <span class="text-primary">Plus</span>
          </h1>
          <p class="font-body-md text-body-md text-on-surface-variant leading-snug px-2">
            Economize tempo e dinheiro em cada compra no mercado.
          </p>
        </div>

        <div class="flex items-center justify-center gap-2 mt-space-md pt-space-xs">
          <span class="inline-flex items-center gap-1 text-primary font-label-md text-label-md bg-primary-fixed/30 px-3 py-1 rounded-full">
            <span class="material-symbols-outlined text-[16px]">verified</span>
            Feito no Brasil
          </span>
          <span class="inline-flex items-center gap-1 text-on-secondary-container font-label-md text-label-md bg-secondary-container/40 px-3 py-1 rounded-full">
            <span class="material-symbols-outlined text-[16px]">savings</span>
            Economia Real
          </span>
        </div>
      </main>

      <footer class="w-full flex flex-col items-center gap-space-md z-10 pb-space-xs max-w-sm">
        <div class="w-full bg-surface-container-lowest p-space-md rounded-2xl shadow-sm space-y-space-xs">
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-primary text-[18px] animate-spin" id="sync-icon">sync</span>
              <span class="font-label-md text-label-md text-on-surface" id="loading-status">Sincronizando suas listas...</span>
            </div>
            <span class="font-label-md text-label-md text-primary font-semibold tabular-nums" id="loading-percent">72%</span>
          </div>
          <div class="w-full h-2 rounded-full bg-surface-container-high overflow-hidden relative">
            <div class="h-full bg-primary rounded-full transition-all duration-300 ease-out" id="loading-bar" style="width: 72%;"></div>
          </div>
        </div>

        <div class="flex flex-col items-center gap-1">
          <div class="flex items-center gap-1.5 text-on-surface-variant font-label-sm text-label-sm">
            <span class="material-symbols-outlined text-[15px] text-primary">lock</span>
            <span>Criptografia de ponta a ponta</span>
            <span>•</span>
            <span class="text-primary font-semibold">100% Seguro</span>
          </div>
          <p class="font-body-sm text-body-sm text-outline">
            Compras Plus Tecnologia Ltda.
          </p>
        </div>
      </footer>
    </div>

    <script>
      (function () {
        let progress = 72;
        const bar = document.getElementById('loading-bar');
        const label = document.getElementById('loading-percent');
        const statusText = document.getElementById('loading-status');
        const syncIcon = document.getElementById('sync-icon');

        const steps = [
          { at: 85, text: 'Carregando cotações locais...' },
          { at: 94, text: 'Preparando seu carrinho...' },
          { at: 100, text: 'Pronto para comprar!' }
        ];

        const interval = setInterval(() => {
          if (progress < 100) {
            progress += 1;
            if (bar) bar.style.width = progress + '%';
            if (label) label.textContent = progress + '%';

            const foundStep = steps.find(s => s.at === progress);
            if (foundStep && statusText) {
              statusText.textContent = foundStep.text;
            }
          } else {
            clearInterval(interval);
            if (syncIcon) {
              syncIcon.classList.remove('animate-spin');
              syncIcon.textContent = 'check_circle';
            }
          }
        }, 45);
      })();
    </script>
  </main>
</body>
</html>
