<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Compras Plus</title>
  
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#059669">
  <script src="/env.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
</head>
<body class="font-body-md text-on-surface bg-surface min-h-screen">
  <div id="app" class="mobile-app-container">
    <div id="main-app-shell" class="main-app-shell hidden">
      <header id="main-app-header" class="sticky top-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe">
        <div class="h-16 px-4 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <button id="btn-hamburger" type="button" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high active:scale-95 transition-all text-on-surface" aria-label="Abrir Menu">
              <span class="material-symbols-outlined text-[24px]">menu</span>
            </button>
            <img src="/icons/icon-192.png" alt="Compras Plus Logo" class="h-8 w-8 rounded-xl object-contain shrink-0 shadow-sm">
            <span class="font-extrabold text-base tracking-tight text-on-surface whitespace-nowrap">Compras <span class="text-primary font-black">Plus</span></span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button id="btn-header-auth" title="Meu Perfil"
              class="flex items-center gap-1.5 h-8 px-3 rounded-full border border-outline-variant/40 bg-surface-container text-on-surface text-[12px] font-semibold hover:bg-surface-container-high active:scale-95 transition-all shadow-sm">
              <span id="header-auth-icon" class="material-symbols-outlined text-primary text-[16px]">account_circle</span>
              <span id="header-auth-label" class="max-w-[70px] truncate">Entrar</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Overlay do Menu Lateral -->
      <div id="app-side-drawer-overlay" class="fixed inset-0 bg-black/50 z-[99] opacity-0 pointer-events-none transition-opacity duration-300"></div>

      <!-- Menu Lateral (Drawer) -->
      <aside id="app-side-drawer" class="fixed top-0 left-0 h-full w-64 bg-surface z-[100] shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="h-16 flex items-center px-4 border-b border-outline-variant/20 pt-safe">
          <span class="font-extrabold text-lg tracking-tight text-on-surface">Compras <span class="text-primary font-black">Plus</span></span>
        </div>
        <nav class="flex-1 py-4 flex flex-col gap-1 px-3">
          <button type="button" class="app-nav-tab active flex items-center h-12 px-4 gap-3 text-on-surface-variant hover:bg-surface-container hover:text-primary rounded-xl transition-all cursor-pointer font-semibold" id="tab-nav-listas" data-target="/dashboard">
            <span class="material-symbols-outlined text-[22px]">checklist</span>
            <span>Listas de Compras</span>
          </button>
          <button type="button" class="app-nav-tab flex items-center h-12 px-4 gap-3 text-on-surface-variant hover:bg-surface-container hover:text-primary rounded-xl transition-all cursor-pointer font-semibold" id="tab-nav-carteira" data-target="/carteira">
            <span class="material-symbols-outlined text-[22px]">account_balance_wallet</span>
            <span>Carteira & Finanças</span>
          </button>
          <button type="button" class="app-nav-tab flex items-center h-12 px-4 gap-3 text-on-surface-variant hover:bg-surface-container hover:text-primary rounded-xl transition-all cursor-pointer font-semibold" id="tab-nav-historico" data-target="/historico">
            <span class="material-symbols-outlined text-[22px]">receipt_long</span>
            <span>Histórico Mensal</span>
          </button>
          <div class="my-2 border-t border-outline-variant/20"></div>
          <button type="button" class="app-nav-tab flex items-center h-12 px-4 gap-3 text-on-surface-variant hover:bg-surface-container hover:text-primary rounded-xl transition-all cursor-pointer font-semibold" id="tab-nav-perfil" data-target="/perfil">
            <span class="material-symbols-outlined text-[22px]">person</span>
            <span>Meu Perfil</span>
          </button>
          <button type="button" class="app-nav-tab hidden flex items-center h-12 px-4 gap-3 text-error hover:bg-error-container hover:text-error rounded-xl transition-all cursor-pointer font-semibold" id="tab-nav-admin" data-target="/admin">
            <span class="material-symbols-outlined text-[22px]">shield_person</span>
            <span>Admin</span>
          </button>
        </nav>
      </aside>
      
      <div id="router-view"></div>
    </div>
  </div>

  <div id="toast-container" class="fixed top-4 inset-x-0 z-[99999] flex flex-col items-center gap-2 pointer-events-none px-4 max-w-md mx-auto"></div>
  
  <script src="/admob.js?v=2.4.0"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
